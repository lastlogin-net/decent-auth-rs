[workspace]

[workspace.dependencies]

[package]
name = "decentauth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib","lib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
#openidconnect = { version = "3.5.0", default-features = false }
openidconnect = { version = "3.5.0" }
extism-pdk = "1.3.0"
url = "2.5.3"
serde_json = "1.0.133"
cookie = "0.18.1"
webfinger = "0.5.1"
http = "1.1.0"
bytes = "1.9.0"
atrium-api = "0.25.8"
atrium-xrpc = "0.12.4"
atrium-common = "0.1.4"
atrium-identity = "0.1.9"
atrium-oauth = { version = "0.1.7", default-features = false }
chrono = "0.4.39"
rand = "0.8.5"
qrcode = "0.14.1"
urlencoding = "2.1.3"
oauth2 = "4.4.2"
ramhorns = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.41.1", features = ["rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.41.1", features = ["full"] }
reqwest = "0.12.9"
lettre = { version = "0.11.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1.41.1", features = ["full"] }
axum = "0.7.9"
axum-macros = "0.4.2"
decentauth-sqlite = { path = "./decentauth-sqlite" }
